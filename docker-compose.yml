services:
  caddy:
    #image: lucaslorentz/caddy-docker-proxy:2.10-alpine
    pull_policy: build
    build:
      context: .
      dockerfile_inline: |
        ARG CADDY_VERSION=2.10
        FROM caddy:$${CADDY_VERSION}-builder AS builder

        RUN xcaddy build \
            --with github.com/lucaslorentz/caddy-docker-proxy/v2 \
            --with github.com/caddy-dns/cloudflare \
            --with github.com/greenpau/caddy-security
            
        FROM caddy:$${CADDY_VERSION}-alpine

        COPY --from=builder /usr/bin/caddy /usr/bin/caddy

        CMD ["caddy", "docker-proxy"]
  #  ports:
   #   - 80:80
    #  - 8443:443
    # - 8443:443/udp
    environment:
      - CADDY_DOCKER_EVENT_THROTTLE_INTERVAL=10s
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/Caddyfile
      - CADDY_INGRESS_NETWORKS=proxy
      - CADDY_DOCKER_SOCKETS=tcp://socket-proxy:2375
    networks:
      - proxy
      - docker-proxy
      - bricknet
      - br0
    volumes:
      # - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/user/appdata/caddy/conf:/etc/caddy
      - /mnt/user/appdata/caddy/data:/data
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_started
    extra_hosts:
      - ${AUTH_SERVICE_HOSTNAME}:127.0.0.1
    labels:
      caddy_0.grace_period: 10s
      caddy_1: "*.${CADDY_PRIMARY_DOMAIN}"
      caddy_1.tls.dns: cloudflare ${CLOUDFLARE_API}
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    environment:
     - ALLOW_START=0 #optional
     - ALLOW_STOP=0 #optional
     - ALLOW_RESTARTS=0 #optional
     - AUTH=0 #optional
     - BUILD=0 #optional
     - COMMIT=0 #optional
     - CONFIGS=0 #optional
     - CONTAINERS=1 #optional
     - DISABLE_IPV6=0 #optional
     - DISTRIBUTION=0 #optional
     - EVENTS=1 #optional
     - EXEC=0 #optional
     - IMAGES=0 #optional
     - INFO=1 #optional
     - LOG_LEVEL=info #optional
     - NETWORKS=1 #optional
     - NODES=0 #optional
     - PING=1 #optional
     - PLUGINS=0 #optional
     - POST=0 #optional
     - SECRETS=0 #optional
     - SERVICES=0 #optional
     - SESSION=0 #optional
     - SWARM=1 #optional
     - SYSTEM=0 #optional
     - TASKS=0 #optional
     - VERSION=1 #optional
     - VOLUMES=0 #optional
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
     - /run
    networks:
      - docker-proxy
networks:
  proxy:
    external: true
  docker-proxy:
    external: true
  bricknet:
    external: true
  br0:
    external: true